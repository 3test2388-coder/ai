<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0078D4, #50E6FF);
            font-family: "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .chat-container {
            width: 100%;
            max-width: 1300px;
            height: 90vh;
            background: #ffffff;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #0078D4;
            color: white;
            padding: 18px 24px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header .logo {
            width: 40px;
            height: 40px;
            background: white;
            color: #0078D4;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        .iframe-wrapper {
            flex: 1;
            background: #f5f7fa;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="header">
            <div class="logo">AI</div>
            <div>
                Multi Model AI Agent
            </div>
        </div>

        <div class="iframe-wrapper">
            9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_multimodelaiagent_CUnTPZ/webchat?__version__=2&enableFileAttachment=false&cliAgent=true"
                title="Copilot Studio Chat">
            </iframe>
        </div>
    </div>
</body>
</html>
