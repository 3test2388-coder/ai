<!DOCTYPE html>
<html lang="ko" style="height: 100%;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Copilot Studio — Webchat</title>

    <!-- Modern system font stack / Inter 대체 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
      :root{
        --bg1: #0f1724;
        --bg2: #081226;
        --card-bg: rgba(255,255,255,0.06);
        --glass: rgba(255,255,255,0.04);
        --accent: #7c5cff;
        --text: #e6eef8;
        --muted: #9fb0c8;
        --radius: 14px;
        --shadow: 0 10px 30px rgba(2,6,23,0.6);
        font-family: Inter, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }

      @media (prefers-color-scheme: light){
        :root{
          --bg1: #f7f9fc;
          --bg2: #eaf0fb;
          --card-bg: rgba(255,255,255,0.8);
          --glass: rgba(255,255,255,0.6);
          --accent: #5b21b6;
          --text: #0b1220;
          --muted: #475569;
          --shadow: 0 8px 24px rgba(15,23,42,0.06);
        }
      }

      html,body{
        height:100%;
        margin:0;
        background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
        color:var(--text);
        -webkit-font-smoothing:antialiased;
        -moz-osx-font-smoothing:grayscale;
      }

      .wrap{
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:32px;
        box-sizing:border-box;
      }

      .card{
        width:100%;
        max-width:1100px;
        height: calc(100vh - 96px);
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
        border-radius:var(--radius);
        box-shadow:var(--shadow);
        border: 1px solid rgba(255,255,255,0.04);
        overflow:hidden;
        display:flex;
        flex-direction:column;
        backdrop-filter: blur(8px);
      }

      .header{
        display:flex;
        align-items:center;
        gap:14px;
        padding:18px 22px;
        border-bottom: 1px solid rgba(255,255,255,0.03);
        background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.01));
      }

      .logo{
        width:44px;
        height:44px;
        border-radius:10px;
        background: linear-gradient(135deg, var(--accent), #2dd4bf);
        display:flex;
        align-items:center;
        justify-content:center;
        color:white;
        font-weight:700;
        box-shadow: 0 6px 18px rgba(124,92,255,0.16);
        flex:0 0 44px;
      }

      .title{
        display:flex;
        flex-direction:column;
      }

      .title .main{
        font-size:16px;
        font-weight:600;
        letter-spacing: -0.2px;
      }
      .title .sub{
        font-size:13px;
        color:var(--muted);
      }

      .content{
        flex:1 1 auto;
        padding:22px;
        display:flex;
        gap:22px;
        box-sizing:border-box;
      }

      /* card for the iframe */
      .webchat-wrap{
        flex:1 1 0;
        min-height:0;
        background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.00));
        border-radius:12px;
        border: 1px solid rgba(255,255,255,0.03);
        overflow:hidden;
        position:relative;
        display:flex;
        flex-direction:column;
      }

      iframe.webchat{
        width:100%;
        height:100%;
        border:0;
        display:block;
        background:transparent;
      }

      /* right panel (optional controls/info) */
      .side{
        width:260px;
        min-width:200px;
        max-width:320px;
        background: linear-gradient(180deg, rgba(255,255,255,0.015), rgba(255,255,255,0.01));
        border-radius:12px;
        padding:16px;
        box-sizing:border-box;
        border:1px solid rgba(255,255,255,0.03);
        display:flex;
        flex-direction:column;
        gap:12px;
      }

      .muted{
        color:var(--muted);
        font-size:13px;
      }

      .btn{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        padding:10px 12px;
        border-radius:10px;
        background:linear-gradient(90deg, var(--accent), #34d399);
        color:white;
        font-weight:600;
        border:none;
        cursor:pointer;
        box-shadow:0 8px 20px rgba(11,22,60,0.14);
      }

      /* loading overlay */
      .overlay{
        position:absolute;
        inset:0;
        display:flex;
        align-items:center;
        justify-content:center;
        background: linear-gradient(180deg, rgba(2,6,23,0.45), rgba(2,6,23,0.25));
        z-index:20;
        transition:opacity .25s ease, visibility .25s ease;
      }

      .overlay.hidden{
        opacity:0;
        visibility:hidden;
        pointer-events:none;
      }

      .spinner{
        width:56px;
        height:56px;
        border-radius:50%;
        border:6px solid rgba(255,255,255,0.08);
        border-top-color:var(--accent);
        animation: spin 1s linear infinite;
        box-shadow:0 6px 18px rgba(11,22,60,0.3);
      }
      @keyframes spin{ to { transform: rotate(360deg); } }

      /* small footer */
      .footer{
        padding:12px 18px;
        font-size:13px;
        color:var(--muted);
        border-top:1px solid rgba(255,255,255,0.02);
        display:flex;
        align-items:center;
        justify-content:space-between;
      }

      /* responsiveness */
      @media (max-width:920px){
        .content{ flex-direction:column; }
        .side{ width:100%; max-width:none; }
        .card{ height: calc(100vh - 64px); max-width:900px; }
      }
      @media (max-width:520px){
        .card{ border-radius:10px; }
        .header{ padding:12px; }
        .title .main{ font-size:15px; }
        .logo{ width:40px; height:40px; border-radius:8px; }
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <div class="card" role="main" aria-label="Copilot Studio Webchat">
        <div class="header">
          <div class="logo" aria-hidden="true">AI</div>
          <div class="title">
            <div class="main">Copilot Studio — Webchat</div>
            <div class="sub">모던한 인터페이스 · 안전한 외부 임베드</div>
          </div>
        </div>

        <div class="content">
          <div class="webchat-wrap" id="webchatCard">
            <div class="overlay" id="loadingOverlay" aria-hidden="true">
              <div class="spinner" aria-hidden="true"></div>
            </div>

            <iframe
              class="webchat"
              id="webchatIframe"
              title="Copilot Studio Webchat"
              src="https://copilotstudio.microsoft.com/environments/9324e73a-cd4e-e049-b7ba-177af6165e9c/bots/crbf2_multimodelaiagent_CUnTPZ/webchat?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true"
              loading="eager"
              allowfullscreen
            ></iframe>
          </div>

          <aside class="side" aria-label="정보 및 제어">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <div style="font-weight:600">설정</div>
                <div class="muted">간단한 옵션 및 설명</div>
              </div>
            </div>

            <div class="muted">이 페이지는 Copilot Studio의 Webchat을 임베드합니다. 외부 컨텐츠 로딩 시 보안/권한을 검토하세요.</div>

            <button class="btn" id="reloadBtn" type="button">다시 불러오기</button>

            <div style="margin-top:auto;font-size:12px;color:var(--muted)">© {Your Project} · 디자인 개선</div>
          </aside>
        </div>

        <div class="footer">
          <div class="muted">문의: admin@yourdomain.example (샘플)</div>
          <div style="color:var(--muted)">로딩 상태: <span id="statusText">로딩 중…</span></div>
        </div>
      </div>
    </div>

    <script>
      const iframe = document.getElementById('webchatIframe');
      const overlay = document.getElementById('loadingOverlay');
      const status = document.getElementById('statusText');
      const reloadBtn = document.getElementById('reloadBtn');

      // Hide overlay when iframe fires load
      iframe.addEventListener('load', () => {
        overlay.classList.add('hidden');
        status.textContent = '완료';
      });

      // Fallback: if iframe hasn't loaded in 8s, update status (network issues)
      const loadTimeout = setTimeout(() => {
        if (!overlay.classList.contains('hidden')) {
          status.textContent = '시간 초과 — 네트워크 확인';
        }
      }, 8000);

      reloadBtn.addEventListener('click', () => {
        overlay.classList.remove('hidden');
        status.textContent = '다시 로드 중…';
        // small cache-bust to force reload
        iframe.src = iframe.src.split('#')[0] + '#reload=' + Date.now();
      });
    </script>
  </body>
</html>
